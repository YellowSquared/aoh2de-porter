buildscript {
  repositories {
    mavenCentral()
    google()
  }
  dependencies {
    // Nothing extra needed here: packaging and signing are AGP's again on this branch.
    // The zip64 branch pulls in commons-compress and bouncycastle to hand-roll both.
  }
}
apply plugin: 'com.android.application'


android {
  namespace = "aoc.kingdoms.lukasz.jakowski"
  compileSdk = 35
  sourceSets {
    main {
      manifest.srcFile 'AndroidManifest.xml'
      java.setSrcDirs(['src/main/java'])
      aidl.setSrcDirs(['src/main/java'])
      renderscript.setSrcDirs(['src/main/java'])
      res.setSrcDirs(['res'])
      jniLibs.setSrcDirs(['libs'])
    }
    // Not '../assets': that is ~125k loose files, which is what blows past AGP's
    // 65,535-entry APK limit in the first place. This directory holds exactly one file,
    // assets.zip, produced by packAssetsZip below and unpacked on first launch.
    debug {
      assets.setSrcDirs([layout.buildDirectory.dir('assets-zip')])
    }
    release {
      assets.setSrcDirs([layout.buildDirectory.dir('assets-zip')])
    }
  }
  packagingOptions {
    resources {
      excludes += ['META-INF/robovm/ios/robovm.xml', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES',
                   'META-INF/dependencies.txt', '**/*.gwt.xml', '**/*.rl']
      pickFirsts += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/license.txt', 'META-INF/LGPL2.1',
                     'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/notice.txt']
    }
  }
  defaultConfig {
    applicationId 'aoc.kingdoms.lukasz.jakowski'
    minSdkVersion 21
    // Pinned below 30 on purpose, and load-bearing. Raising this to 35 was tested
    // directly against an API 36 emulator (2026-08-08) and the install fails:
    //
    //   -124: Targeting R+ (version 30 and above) requires the resources.arsc of
    //   installed APKs to be stored uncompressed and aligned on a 4-byte boundary
    //
    // That failure belonged to the zip64 branch, where zipalign and apksigner both refuse to
    // read the hand-rolled archive. This branch produces a stock AGP APK, so both tools work
    // and raising targetSdk is plausible here — left at 28 only so the two branches stay
    // comparable. Worth revisiting if this approach is adopted, since Play needs 35.
    targetSdkVersion 28
    versionCode 1
    versionName "1.0"
    multiDexEnabled true
  }
  compileOptions {
    sourceCompatibility "8"
    targetCompatibility "8"
    coreLibraryDesugaringEnabled = true
  }
  buildTypes {
    debug {
      minifyEnabled false
    }
    release {
      minifyEnabled false
      //noinspection NotShrinkingResources
      shrinkResources false

      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }

  aaptOptions {
    noCompress 'zip', 'png', 'jpg', 'jpeg', 'ogg', 'json', 'atlas', 'fnt'
  }
}

repositories {
  google()
}

configurations { natives }

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation 'androidx.multidex:multidex:2.0.1'
  implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
  implementation project(':core')

  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
  natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

}

// Declares inputs/outputs rather than doing everything in an untracked doFirst: the .so
// files only change when gdxVersion does, so re-extracting all eight natives jars on
// every build was pure overhead. The old `configurations.natives.copy()` also resolved a
// throwaway detached configuration each time (the single slowest dependency resolution
// in the profile); the configuration itself works fine as an input.
tasks.register('copyAndroidNatives') {
  def abiDirs = ['armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'].collectEntries { [(it): file("libs/$it")] }

  inputs.files(configurations.natives).withPropertyName('natives')
  outputs.dirs(abiDirs.values().toList()).withPropertyName('abiDirs')

  doLast {
    abiDirs.values()*.mkdirs()

    configurations.natives.files.each { jar ->
      // x86_64 is checked before x86 by construction — "natives-x86_64.jar" does not end
      // with "natives-x86.jar", so at most one ABI can ever match.
      def abi = abiDirs.keySet().find { jar.name.endsWith("natives-${it}.jar") }
      if (abi == null) return
      copy {
        from zipTree(jar)
        into abiDirs[abi]
        include "*.so"
      }
    }
  }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
  packageTask.dependsOn 'copyAndroidNatives'
}

def resolveSdkDir = {
  def localProperties = project.file("../local.properties")
  if (localProperties.exists()) {
    Properties properties = new Properties()
    localProperties.withInputStream { instr -> properties.load(instr) }
    def sdkDir = properties.getProperty('sdk.dir')
    if (sdkDir) return sdkDir
  }
  return System.env.ANDROID_SDK_ROOT ?: System.env.ANDROID_HOME
}

def resolveAdb = {
  def sdkDir = resolveSdkDir()
  if (!sdkDir) {
    throw new GradleException("Android SDK not found — set sdk.dir in local.properties or ANDROID_SDK_ROOT/ANDROID_HOME.")
  }
  def adb = ['adb.exe', 'adb'].collect { new File(sdkDir, "platform-tools/$it") }.find { it.isFile() }
  if (!adb) throw new GradleException("adb not found under $sdkDir/platform-tools")
  return adb.absolutePath
}

def launchActivity = 'aoc.kingdoms.lukasz.jakowski/aoc.kingdoms.lukasz.jakowski.android.AndroidLauncher'

// Launches the app. installDebug is AGP's own install task, available again on this branch
// because packaging is no longer hand-rolled.
tasks.register('run', Exec) {
  group = 'porter'
  description = 'Builds, installs and launches the APK'
  dependsOn 'installDebug'
  commandLine resolveAdb(), 'shell', 'am', 'start', '-n', launchActivity
}

// =============================================================================
// SINGLE-ARCHIVE ASSETS (the alternative to hand-rolled zip64 packaging)
// =============================================================================
//
// AGP refuses to write an APK with more than 65,535 entries, and this game ships ~125k
// asset files. The zip64 branch answers that by replacing AGP's packaging entirely; this
// branch instead makes the count a non-issue — assets go in as ONE entry, so a completely
// stock AGP build stays under the limit, with normal signing and zipalign.
//
// The runtime half is in patch/: FileLimitPatcher rewrites every Gdx.files.internal(path)
// in the game jar into GdxAssetBase.getFile(path), which resolves against the extracted
// copy. AndroidLauncher unpacks assets.zip into getFilesDir()/assets on first launch and
// sets GdxAssetBase.baseDir.
//
// Trade-off versus the zip64 approach: the device needs room for both the APK and the
// extracted copy (~2x), and the first launch pays a one-time unpack.
tasks.register('packAssetsZip', Zip) {
  group = 'porter'
  description = 'Packs assets/ into a single assets.zip that ships inside the APK.'
  archiveFileName = 'assets.zip'
  destinationDirectory = layout.buildDirectory.dir('assets-zip')
  from rootProject.file('assets')
  // aaptOptions.noCompress 'zip' keeps AAPT from recompressing this, so whatever compression
  // is chosen here is what ends up in the APK. Deflate: most assets are already-compressed
  // png/ogg so the saving is modest, but it costs nothing at build time and the extractor
  // inflates once.
  includeEmptyDirs = false
  // Gradle's Zip task refuses >65535 entries unless told otherwise, and this holds ~125k —
  // the same limit that started all of this, hit one layer down. Harmless here: unlike the
  // APK, nothing but our own extractor reads this file, and java.util.zip handles zip64
  // reads fine. The APK itself still contains a single entry.
  zip64 = true
}

// The assets source dir is generated, so every consumer of it has to wait for the task that
// generates it. Wiring the merge*Assets tasks covers both variants without naming them.
tasks.matching { it.name ==~ /merge.*Assets/ }.configureEach {
  dependsOn 'packAssetsZip'
}


