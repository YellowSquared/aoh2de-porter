[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

def stripTask = rootProject.tasks.named('stripGameJar')

dependencies {
    api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    api "com.badlogicgames.gdx:gdx:$gdxVersion"
    // Exposes the stripped game jar to consumers via both apiElements (compile) and
    // runtimeElements (runtime/dex) — no jar repacking needed.
    api files(stripTask.flatMap { it.archiveFile })
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
