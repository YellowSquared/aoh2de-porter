# A resident daemon is what makes repeat builds cheap here. Without it every
# invocation pays ~4.3s JVM/Gradle startup + ~2.7s configuration from cold, runs the
# zip64 packer's 110k-file loop in a never-JIT-warmed VM, and — worst of all — has to
# re-stat all 110k merged assets to decide mergeDebugAssets is up to date (~11.6s
# measured). With the daemon that snapshot is served from the retained virtual file
# system instead. 32 GiB on this machine, and the daemon heap is capped at 4G below.
org.gradle.daemon=true
org.gradle.jvmargs=-Xms1G -Xmx4G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
# Keeps the VFS (and therefore the asset snapshot above) hot between builds.
org.gradle.vfs.watch=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.logging.level=quiet

android.useAndroidX=true
android.enableR8.fullMode=false

robovmVersion=2.3.23
# game.jar is compiled against libGDX 1.10.0, whose natives are 4 KB page-aligned and so
# cannot be loaded on a 16 KB-page device without the extractNativeLibs escape hatch.
# 1.13.0 is the first release whose .so files carry p_align=0x4000; verified across all four
# ABIs for both gdx-platform and gdx-freetype-platform on the version pinned here.
#
# This is a *binary* upgrade of a jar we cannot recompile, so it is only safe as far as
# libGDX kept binary compatibility, and the compiler never checks it. Do not move this
# version without re-running the two scans described in PORTING-NOTES change 7 — the call
# site scan AND the abstract-method scan. The first upgrade attempt died on a removed
# Input.setCatchBackKey that a broken scan had cleared.
gdxVersion=1.14.2
projectVersion=1.0.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
